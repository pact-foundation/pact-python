#:schema https://raw.githubusercontent.com/rvben/rumdl/main/rumdl.schema.json

[global]
flavor = "mkdocs"
exclude = [".github/PULL_REQUEST_TEMPLATE.md"]
# Pre-commit hooks pass file paths explicitly; apply `exclude` to them too.
force_exclude = true
disable = [
  "line-length",
  # MkDocs generates reference links that are not visible to the linter.
  "reference-links-images",
  # Changelogs generated by git-cliff mix tight and loose list items.
  "MD076",
]

[per-file-ignores]
# Docs link to pages that MkDocs generates at build time.
"docs/**/*.md" = ["MD057"]
"pact-python-ffi/docs/**/*.md" = ["MD057"]

[ul-indent]
indent = 4
style = "fixed"

[list-marker-space]
ul-single = 3
ul-multi = 3
ol-single = 2
ol-multi = 2

[code-block-style]
style = "fenced"

[emphasis-style]
style = "underscore"

[strong-style]
style = "asterisk"
